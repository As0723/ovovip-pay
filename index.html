<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>扫码付款</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
background:linear-gradient(160deg,#0f172a 0%,#1e293b 100%);min-height:100vh;color:#e2e8f0;
display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
.card{width:100%;max-width:360px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
border-radius:20px;padding:24px 20px;backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(0,0,0,.4)}
h1{font-size:19px;text-align:center;font-weight:600;letter-spacing:.5px;margin-bottom:4px}
.sub{text-align:center;font-size:12px;color:#94a3b8;margin-bottom:20px}
.timer-wrap{text-align:center;margin-bottom:18px}
.timer-label{font-size:12px;color:#94a3b8;margin-bottom:6px}
.timer{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px;
color:#38bdf8;text-shadow:0 0 18px rgba(56,189,248,.55);transition:color .3s}
.timer.warn{color:#f87171;text-shadow:0 0 18px rgba(248,113,113,.6);animation:blink 1s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
.qr-box{position:relative;width:190px;height:190px;margin:0 auto 8px;background:#fff;border-radius:14px;
display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.qr-box img,.qr-box canvas{display:block;width:160px!important;height:160px!important}
.scanline{position:absolute;left:0;width:100%;height:28px;pointer-events:none;
background:linear-gradient(180deg,rgba(56,189,248,0) 0%,rgba(56,189,248,.35) 50%,rgba(56,189,248,0) 100%);
animation:scan 2.2s linear infinite}
@keyframes scan{0%{top:-28px}100%{top:190px}}
.expired{display:none;width:190px;height:190px;margin:0 auto 8px;border:2px dashed #64748b;border-radius:14px;
align-items:center;justify-content:center;flex-direction:column;color:#94a3b8;font-size:15px;letter-spacing:1px}
.expired.show{display:flex}
.qr-box.hide{display:none}
.pay-btn{display:block;width:100%;margin-top:20px;padding:14px;border:none;border-radius:12px;
background:linear-gradient(90deg,#1677ff,#00b4ff);color:#fff;font-size:17px;font-weight:600;letter-spacing:1px;
box-shadow:0 8px 20px rgba(22,119,255,.35);transition:all .25s}
.pay-btn:active{transform:scale(.98)}
.pay-btn:disabled{background:#334155;color:#64748b;box-shadow:none}
.channels{display:none;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.ch{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
display:flex;align-items:center;justify-content:center;font-size:12px;color:#64748b;
font-variant-numeric:tabular-nums;transition:all .3s}
.ch.on{color:#22d3ee;border-color:#22d3ee;animation:neon 2s ease-in-out infinite}
@keyframes neon{0%,100%{color:#a5f3fc;border-color:#22d3ee;
  text-shadow:0 0 4px #22d3ee,0 0 10px #22d3ee,0 0 20px #06b6d4;
  box-shadow:0 0 6px rgba(34,211,238,.7),0 0 14px rgba(34,211,238,.45),inset 0 0 6px rgba(34,211,238,.35)}
  50%{color:#22d3ee;border-color:#0e7490;
  text-shadow:0 0 2px #22d3ee,0 0 5px #06b6d4;
  box-shadow:0 0 3px rgba(34,211,238,.4),inset 0 0 3px rgba(34,211,238,.2)}}
.foot{margin-top:18px;text-align:center;font-size:11px;color:#64748b;letter-spacing:.5px;transition:color .3s}
.foot.dead{color:#f87171;font-weight:600;animation:blink 1s steps(1,end) infinite}
</style>
</head>
<body>
<div class="card">
  <h1>扫码付款</h1>
  <div class="sub">请使用支付宝扫一扫</div>

  <div class="timer-wrap">
    <div class="timer-label">二维码有效时间</div>
    <div class="timer" id="timer">15:00</div>
  </div>

  <div class="qr-box" id="qrBox"><div class="scanline"></div></div>
  <div class="expired" id="expired">二维码已失效</div>

  <button class="pay-btn" id="payBtn">打开支付宝付款</button>

  <div class="channels" id="channels"></div>
  <div class="foot" id="foot"> 请勿重复支付</div>
</div>

<script>
(function(){
  var LINKS=[
    "https://qr.alipay.com/00c13746jcneeq2anfpoea9",
    "https://qr.alipay.com/fkx15004hmiijfybmdv5m00",
    "https://qr.alipay.com/2m614466nlyo3ujnhrk61be",
    "https://qr.alipay.com/45t10206rqmohok0bupalb6",
    "https://qr.alipay.com/5dk16229dgj2de9x6zosve1",
    "https://qr.alipay.com/45t14805viajwymj81z7m1c",
    "https://qr.alipay.com/2m618074znnueaatzstjqeb",
    "https://qr.alipay.com/036173630wraunicrfcyh80",
    "https://qr.alipay.com/03615524tlpmcfmyeuqab4c",
    "https://qr.alipay.com/03617717yzsirye1mapb527",
    "https://qr.alipay.com/03614552xiapa2rcorknqb8",
    "https://qr.alipay.com/tsx16893y6otcezc9jqsucf"
  ];
  var TOTAL=15*60, left=TOTAL, cur=-1, dead=false;
  var qrBox=document.getElementById('qrBox'),
      expired=document.getElementById('expired'),
      timerEl=document.getElementById('timer'),
      payBtn=document.getElementById('payBtn'),
      foot=document.getElementById('foot'),
      chWrap=document.getElementById('channels');

  for(var i=0;i<LINKS.length;i++){
    var s=document.createElement('span');
    s.className='ch'; s.textContent=i+1; s.dataset.i=i;
    chWrap.appendChild(s);
  }
  var chs=chWrap.children;

  function render(){
    if(dead) return;
    var next;
    do{ next=Math.floor(Math.random()*LINKS.length); }while(next===cur);
    cur=next;
    qrBox.innerHTML='<div class="scanline"></div>';
    new QRCode(qrBox,{text:LINKS[cur],width:160,height:160,correctLevel:QRCode.CorrectLevel.M});
    for(var i=0;i<chs.length;i++) chs[i].classList.toggle('on',i===cur);
  }

  function tick(){
    if(dead) return;
    left--;
    if(left<=0){ expire(); return; }
    var m=Math.floor(left/60), s=left%60;
    timerEl.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    if(left<=60) timerEl.classList.add('warn');
  }

  function expire(){
    dead=true;
    clearInterval(timerId); clearInterval(swapId);
    timerEl.textContent='00:00';
    timerEl.classList.add('warn');
    qrBox.classList.add('hide');
    expired.classList.add('show');
    payBtn.disabled=true;
    payBtn.textContent='二维码已失效';
    foot.textContent='二维码已失效，请重新进入页面';
    foot.classList.add('dead');
    for(var i=0;i<chs.length;i++) chs[i].classList.remove('on');
  }

  render();
  var timerId=setInterval(tick,1000);
  var swapId=setInterval(render,2000);

  payBtn.addEventListener('click',function(){
    if(dead) return;
    window.location.href=LINKS[cur];
  });

  window.addEventListener('pageshow',function(e){
    if(e.persisted) window.location.reload();
  });
  if('scrollRestoration' in history) history.scrollRestoration='manual';
})();
</script>
</body>
</html>
