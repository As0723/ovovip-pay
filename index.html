<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>茶小二 · 收银台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f5f6f7;color:#222;min-height:100vh}
.hd{background:#fff;padding:18px;text-align:center;border-bottom:1px solid #eee}
.hd h1{font-size:19px;font-weight:600}
.card{background:#fff;margin:12px;border-radius:14px;padding:22px 18px;text-align:center}
.amt{font-size:36px;font-weight:700;color:#1677ff;margin:6px 0}
.timer{font-size:14px;color:#666;margin:10px 0}
.timer.warn{color:#e64340;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.qr-wrap{position:relative;width:210px;height:210px;margin:18px auto}
.qr{width:210px;height:210px;border:1px solid #eee;border-radius:10px}
.qr-expired{position:absolute;inset:0;border:2px dashed #ccc;border-radius:10px;display:none;align-items:center;justify-content:center;color:#999;font-size:14px;background:#fafafa}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:26px;font-size:16px;font-weight:600;margin-top:12px;background:#1677ff;color:#fff}
.btn:disabled{background:#ccc;color:#999}
</style>
</head>
<body>

<div class="hd"><h1>茶小二</h1></div>

<div class="card">
  <div class="amt">¥<span id="amt">0.00</span></div>
  <div class="timer" id="timer">二维码有效期 15:00</div>
  <div class="qr-wrap">
    <img class="qr" id="qr" src="" alt="收款码">
    <div class="qr-expired" id="expired">二维码已失效</div>
  </div>
  <button class="btn" id="payBtn" onclick="goPay()">打开支付宝付款</button>
</div>

<script>
var LINKS=[
'https://qr.alipay.com/45t10206rqmohok0bupalb6',
'https://qr.alipay.com/2m614466nlyo3ujnhrk61be',
'https://qr.alipay.com/fkx15004hmiijfybmdv5m00'
];
var DURATION=15*60;
var current=Math.floor(Math.random()*LINKS.length);
var endTime=0,expired=false;
var params=new URLSearchParams(location.search);
if(params.get('amt'))document.getElementById('amt').textContent=parseFloat(params.get('amt')).toFixed(2);
var cp=parseInt(params.get('code'));
if(cp>=1&&cp<=LINKS.length)current=cp-1;
document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=420x420&data='+encodeURIComponent(LINKS[current]);
endTime=Date.now()+DURATION*1000;
var ti=setInterval(function(){
var r=Math.max(0,Math.floor((endTime-Date.now())/1000));
var m=Math.floor(r/60),s=r%60;
var el=document.getElementById('timer');
el.textContent='二维码有效期 '+m+':'+('0'+s).slice(-2);
if(r<=60)el.className='timer warn';
if(r===0){clearInterval(ti);expired=true;document.getElementById('qr').style.display='none';document.getElementById('expired').style.display='flex';document.getElementById('payBtn').disabled=true;}
},1000);
function goPay(){if(expired)return;window.location.href=LINKS[current];}
window.addEventListener('pageshow',function(e){if(e.persisted)location.reload();});
</script>
</body>
</html>
